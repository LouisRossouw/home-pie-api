<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomePie - Authenticate App</title>
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #1a1a1a;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #333;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: -0.02em;
        }
        p {
            color: #888;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn {
            background: #ffffff;
            color: #000000;
            padding: 0.8rem 1.5rem;
            border-radius: 0.8rem;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    {% if success %}
    <script>
        // Try to redirect back to the app via deep link
        setTimeout(() => {
            window.location.href = "{{ protocol }}://?intent=completed-auth-app";
        }, 2000);
    </script>
    {% endif %}
</head>
<body>
    <div class="card">
        {% if success %}
            <div class="loader"></div>
            <h1>Authenticated!</h1>
            <p>You have successfully signed in to HomePie. You can now close this window and return to the desktop app.</p>
            <a href="{{ protocol }}://?intent=completed-auth-app" class="btn">Return to App</a>
        {% else %}
            <h1>Sign in to HomePie</h1>
            <p>Please log in to authorize the desktop application.</p>
            <form method="post" action="{% url 'admin:login' %}?next={{ request.get_full_path }}">
                {% csrf_token %}
                <button type="submit" class="btn">Go to Login</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
