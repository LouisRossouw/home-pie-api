# docker-compose.yml
services:
  api:
    build: .
    container_name: home-pie-api
    restart: unless-stopped
    ports:
      - "7979:7979"
    volumes:
      # Mount the SQLite database file to persist data across container restarts.
      # Make sure db.sqlite3 exists on your host before running docker compose, 
      # otherwise Docker will create a directory named db.sqlite3 instead of a file.
      - ./db.sqlite3:/app/db.sqlite3
      
      # Optional: if you want to mount your entire project for live code reloading during development, uncomment below:
      # - .:/app/
    env_file:
      - .env
    # For development/local network, gunicorn is already the default CMD in the Dockerfile.
    # If you want to override the command to run the development server with live reload:
    # command: python manage.py runserver 0.0.0.0:8000
